apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: dkn-argocd-ns
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Pods are in private subnets with no NodePort involved, so the ALB
    # sends traffic straight to Pod IPs instead of via a NodePort.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
