apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/DineshKNarayanankutty/argocd-gitops-project.git
    targetRevision: main
    path: gitops/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: dkn-argocd-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
